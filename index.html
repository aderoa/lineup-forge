<title>Lineup Forge</title>
<!--
  forge.hoopsmatic.com has no root document, so the bare domain returns the
  GitHub Pages 404. This sends it to the app.

  A REDIRECT RATHER THAN A RENAME, deliberately. Renaming lineup_forge.html to
  index.html would break every existing link to it -- Presto iframes above all,
  which are copied attribute-for-attribute and point at the filename.
-->
<link rel="canonical" href="https://forge.hoopsmatic.com/lineup_forge.html">
<meta http-equiv="refresh" content="0; url=lineup_forge.html">
<script>location.replace('lineup_forge.html' + location.search + location.hash);</script>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center;
         font: 16px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
         background: #fbfbfc; color: #1a1d21; }
  @media (prefers-color-scheme: dark) {
    body { background: #14161a; color: #e8eaed; }
  }
  a { color: inherit; }
</style>
</head>
<body>
  <p>Opening <a href="lineup_forge.html">Lineup Forge</a>&hellip;</p>
