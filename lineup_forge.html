<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lineup Forge — HoopsMatic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg: #0c0f14; --surface: #141820; --surface2: #1a1f2b; --border: #252b38;
  --text1: #e8eaed; --text2: #9aa0ad; --muted: #5e6577;
  --accent: #3b82f6; --accent-dim: rgba(59,130,246,0.12);
  --green: #22c55e; --red: #ef4444; --orange: #f59e0b; --gold: #f0b637; --purple: #a78bfa;
}
body { font-family:'DM Sans',sans-serif; background:var(--bg); color:var(--text1); min-height:100vh; padding-bottom:4rem; }
::-webkit-scrollbar { height:6px; width:6px; }
::-webkit-scrollbar-track { background:transparent; }
::-webkit-scrollbar-thumb { background:#2a3142; border-radius:3px; }

.header { background:linear-gradient(135deg,#1a1f2b 0%,#0c0f14 100%); border-bottom:1px solid var(--border); padding:1.25rem 2rem; display:flex; align-items:center; gap:1rem; }
.header .logo { font-size:1.4rem; font-weight:800; letter-spacing:-0.02em; cursor:pointer; transition:opacity 0.15s; user-select:none; }
.header .logo:hover { opacity:0.75; }
.header .logo span { color:var(--accent); }
.header .badge { font-size:0.6rem; padding:0.2rem 0.5rem; background:rgba(59,130,246,0.15); color:var(--accent); border-radius:4px; font-weight:600; letter-spacing:0.05em; }
.header .sub { font-size:0.7rem; color:var(--muted); margin-left:auto; font-family:'JetBrains Mono',monospace; }

#status { padding:0.6rem 2rem; background:rgba(245,158,11,0.08); color:var(--orange); font-size:0.78rem; border-bottom:1px solid var(--border); }
#status.ready { background:rgba(34,197,94,0.06); color:var(--green); }
#status.error { background:rgba(239,68,68,0.08); color:var(--red); }
#status.hidden { display:none; }

.wrap { max-width:1200px; margin:0 auto; padding:1.5rem 2rem; }

.breadcrumb { display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap; font-size:0.78rem; color:var(--text2); margin-bottom:1.25rem; }
.breadcrumb .crumb { color:var(--text2); cursor:pointer; transition:color .15s; }
.breadcrumb .crumb.active { color:var(--accent); font-weight:600; cursor:default; }
.breadcrumb .crumb:hover:not(.active) { color:var(--text1); }
.breadcrumb .sep { color:var(--muted); }
.breadcrumb select { font-family:inherit; font-size:0.8rem; padding:0.3rem 0.5rem; margin-left:0.5rem; background:var(--surface2); color:var(--text1); border:1px solid var(--border); border-radius:5px; outline:none; }

.team-grid { display:grid; grid-template-columns:repeat(6, 1fr); gap:0.6rem; }
.team-tile { background:var(--surface); border:1px solid var(--border); border-radius:8px; padding:1.1rem 0.5rem; text-align:center; cursor:pointer; transition:border-color .15s, transform .1s, background .15s; font-family:'JetBrains Mono',monospace; font-weight:700; font-size:1.05rem; letter-spacing:0.02em; }
.team-tile:hover { border-color:var(--accent); background:var(--accent-dim); }
.team-tile:active { transform:translateY(1px); }
.team-tile .team-full { font-family:'DM Sans',sans-serif; font-weight:500; font-size:0.62rem; color:var(--muted); margin-top:0.3rem; }

.lineup-list { display:flex; flex-direction:column; gap:0.5rem; }
.lineup-card { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:0.9rem 1.1rem; cursor:pointer; transition:border-color .15s, background .15s; display:grid; grid-template-columns:1fr auto auto auto auto; gap:1rem; align-items:center; }
.lineup-card:hover { border-color:var(--accent); background:rgba(59,130,246,0.04); }
.lineup-card .names { font-size:0.84rem; font-weight:600; line-height:1.4; }
.lineup-card .names .sep { color:var(--muted); margin:0 0.25rem; font-weight:400; }
.lineup-card .stat { display:flex; flex-direction:column; gap:0.1rem; text-align:right; font-family:'JetBrains Mono',monospace; }
.lineup-card .stat .lbl { font-size:0.56rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
.lineup-card .stat .val { font-size:0.92rem; font-weight:700; }
.lineup-card .stat.net .val.pos { color:var(--green); }
.lineup-card .stat.net .val.neg { color:var(--red); }
.lineup-card .stat.net .val.neutral { color:var(--orange); }

.empty-state { text-align:center; padding:2.5rem 1rem; color:var(--muted); font-size:0.85rem; background:var(--surface); border:1px dashed var(--border); border-radius:10px; }

.proj-panel { background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:1.25rem 1.5rem; margin-bottom:1.25rem; }
.proj-row { display:flex; gap:2rem; flex-wrap:wrap; align-items:baseline; }
.proj-stat { display:flex; flex-direction:column; gap:0.15rem; min-width:90px; }
.proj-stat .label { font-size:0.6rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.06em; font-weight:600; }
.proj-stat .value { font-family:'JetBrains Mono',monospace; font-size:1.5rem; font-weight:700; }
.proj-stat.headline .value { font-size:2.4rem; color:var(--accent); line-height:1.1; }
.proj-stat.headline.green .value { color:var(--green); }
.proj-stat.headline.red .value { color:var(--red); }
.proj-stat.headline.orange .value { color:var(--orange); }
.proj-stat .delta { font-family:'JetBrains Mono',monospace; font-size:0.72rem; margin-top:0.15rem; }
.proj-stat .delta.pos { color:var(--green); }
.proj-stat .delta.neg { color:var(--red); }
.proj-stat .delta.zero { color:var(--muted); }

.proj-tier { font-size:0.74rem; color:var(--text2); font-style:italic; margin-top:1rem; padding:0.5rem 0.75rem; background:var(--surface2); border-radius:6px; border-left:3px solid var(--accent); }

.lineup-grid { display:grid; grid-template-columns:repeat(5, 1fr); gap:0.6rem; margin-bottom:1.25rem; }
.slot { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:0.9rem 0.75rem; position:relative; display:flex; flex-direction:column; gap:0.45rem; transition:border-color .15s; }
.slot.swapped { border-color:var(--purple); background:rgba(167,139,250,0.04); }
.slot .slot-num { font-size:0.55rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.08em; font-weight:600; }
.slot .name { font-weight:700; font-size:0.85rem; line-height:1.2; }
.slot .meta { font-family:'JetBrains Mono',monospace; color:var(--muted); font-size:0.62rem; }
.slot .stats { font-family:'JetBrains Mono',monospace; font-size:0.68rem; color:var(--text2); line-height:1.5; }
.slot .swap-btn { margin-top:auto; padding:0.4rem 0.6rem; background:var(--surface2); color:var(--text1); border:1px solid var(--border); border-radius:5px; cursor:pointer; font-family:inherit; font-size:0.7rem; font-weight:600; transition:border-color .15s, color .15s; }
.slot .swap-btn:hover { border-color:var(--accent); color:var(--accent); }
.slot .from-tag { position:absolute; top:0.4rem; right:0.4rem; font-family:'JetBrains Mono',monospace; font-size:0.5rem; color:var(--purple); background:rgba(167,139,250,0.1); padding:0.15rem 0.35rem; border-radius:3px; letter-spacing:0.04em; font-weight:600; }

.action-row { display:flex; gap:0.6rem; margin-bottom:1.25rem; flex-wrap:wrap; }
.btn { font-family:inherit; font-size:0.82rem; font-weight:700; padding:0.6rem 1.2rem; border:none; border-radius:6px; cursor:pointer; transition:background .15s, transform .1s; background:var(--accent); color:#fff; }
.btn:hover { background:#2563eb; }
.btn:active { transform:translateY(1px); }
.btn.secondary { background:var(--surface2); color:var(--text1); border:1px solid var(--border); }
.btn.secondary:hover { border-color:var(--accent); color:var(--accent); }

.breakdown { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:1rem 1.25rem; margin-bottom:1rem; }
.breakdown h3 { font-size:0.88rem; font-weight:700; margin-bottom:0.5rem; }
.breakdown table { width:100%; font-size:0.76rem; border-collapse:collapse; }
.breakdown td, .breakdown th { padding:0.35rem 0.5rem; border-bottom:1px solid var(--border); text-align:left; }
.breakdown th { font-size:0.58rem; color:var(--muted); text-transform:uppercase; letter-spacing:0.05em; }
.breakdown td.num { font-family:'JetBrains Mono',monospace; text-align:right; }
.breakdown tr:last-child td { border-bottom:none; }
.breakdown tr.total { font-weight:700; background:var(--surface2); }
.breakdown td.adj-pos { color:var(--green); }
.breakdown td.adj-neg { color:var(--red); }

.notes { font-size:0.7rem; color:var(--text2); line-height:1.6; padding:0.8rem 1rem; background:var(--surface2); border-radius:8px; }
.notes strong { color:var(--text1); }
.notes ul { margin:0.3rem 0 0 1.2rem; }

.modal-bg { position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; display:none; align-items:flex-start; justify-content:center; padding:3rem 1rem; }
.modal-bg.open { display:flex; }
.modal { background:var(--surface); border:1px solid var(--border); border-radius:12px; width:100%; max-width:480px; padding:1.25rem; max-height:80vh; overflow-y:auto; }
.modal h3 { font-size:1rem; margin-bottom:0.5rem; }
.modal .swap-sub { font-size:0.74rem; color:var(--muted); margin-bottom:0.85rem; }
.modal input[type=text] { width:100%; padding:0.6rem 0.75rem; font-family:inherit; font-size:0.9rem; background:var(--surface2); color:var(--text1); border:1px solid var(--border); border-radius:6px; outline:none; margin-bottom:0.85rem; }
.modal input[type=text]:focus { border-color:var(--accent); }
.swap-results { display:flex; flex-direction:column; gap:0.3rem; }
.swap-result-item { padding:0.55rem 0.7rem; cursor:pointer; border:1px solid var(--border); border-radius:6px; transition:border-color .15s, background .15s; }
.swap-result-item:hover { border-color:var(--accent); background:var(--accent-dim); }
.swap-result-item .name { font-weight:600; font-size:0.84rem; }
.swap-result-item .meta { font-family:'JetBrains Mono',monospace; color:var(--muted); font-size:0.66rem; margin-top:0.15rem; }
.modal .close-btn { width:100%; margin-top:0.5rem; padding:0.5rem; background:var(--surface2); color:var(--text2); border:1px solid var(--border); border-radius:6px; cursor:pointer; font-family:inherit; font-size:0.82rem; }
.modal .close-btn:hover { color:var(--text1); border-color:var(--accent); }

@media (max-width: 900px), (pointer: coarse) {
  .header { padding:1rem; }
  .wrap { padding:1rem; }
  .team-grid { grid-template-columns:repeat(4, 1fr); gap:0.4rem; }
  .team-tile { padding:0.8rem 0.4rem; font-size:0.92rem; }
  .lineup-card { grid-template-columns:1fr auto; row-gap:0.4rem; padding:0.7rem; }
  .lineup-card .stat { flex-direction:row; align-items:baseline; gap:0.3rem; }
  .lineup-card .stat .lbl { font-size:0.6rem; }
  .lineup-card .stat .val { font-size:0.78rem; }
  .lineup-grid { grid-template-columns:repeat(2, 1fr); }
  .slot { padding:0.7rem 0.55rem; }
  .proj-stat .value { font-size:1.2rem; }
  .proj-stat.headline .value { font-size:1.6rem; }
  .proj-row { gap:1rem; }
}
</style>
</head>
<body>

<div class="header">
  <div class="logo">Lineup<span>Forge</span></div>
  <div class="badge">HOOPSMATIC</div>
  <div class="sub" id="meta">Loading...</div>
</div>

<div id="status">Initializing...</div>

<div class="wrap">
  <div class="breadcrumb" id="breadcrumb"><span class="crumb active">Choose team</span></div>
  <div id="content"></div>
</div>

<div class="modal-bg" id="swapModal">
  <div class="modal">
    <h3 id="swapTitle">Swap player</h3>
    <div class="swap-sub" id="swapSub"></div>
    <input type="text" id="swapInput" placeholder="Type player name..." autocomplete="off">
    <div class="swap-results" id="swapResults"></div>
    <button class="close-btn" id="swapClose">Cancel</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/sql-wasm.min.js"></script>
<script>
const PLAYER_DB_URL  = 'https://aderoa.github.io/lineup-forge/player_stats.db.gz';
const LINEUPS_DB_URL = 'https://aderoa.github.io/lineup-forge/lineups.db.gz';
const COEFS_URL      = 'https://aderoa.github.io/lineup-forge/fit_coefficients.json';
const NAMES_URL      = 'https://aderoa.github.io/lineup-forge/name_dictionary.json';
const QUALITY_URL    = 'https://aderoa.github.io/lineup-forge/player_quality.json';

// Defensive Rankings — fetched live from the same sheet Defense page uses
const DEF_SHEET_ID   = '1JH2FUBIyQ1zEHzZBxgP8vHBZ7d8EtP5-fSVG3zMgCgg';
const DEF_API_KEY    = 'AIzaSyB9g7c6llswswuZQ2I5y2MwGk6BzYEtHsY';
const DEF_URL        = `https://sheets.googleapis.com/v4/spreadsheets/${DEF_SHEET_ID}/values/Defensive_Rankings?key=${DEF_API_KEY}`;

const USG_HIGH = 0.25, SHOOT_OK = 0.35, SHOOT_MIN_3PA = 1.5;
const AST_HIGH = 0.20, REB_HIGH = 0.10, BLK_HIGH = 1.0;

// Two-axis quality model
const OFF_CALIB = 12, OFF_SCALE = 0.25;   // (rat365 - 12) × 0.25 = offense contribution per player
const DEF_CALIB = 10, DEF_SCALE = 0.18;   // (DEF_SCORE - 10) × 0.18 = defense contribution per player
const LEAGUE_BASE = 115;                  // NBA-avg ORtg/DRtg anchor

// Boost gate (gradual GP-based taper): only apply the asymmetric historical boost
// when current-season sample is limited. Linear taper between FULL and NONE:
//   currentGP ≤ BOOST_GP_FULL: full boost (still ramping-up or injury-disrupted)
//   currentGP ≥ BOOST_GP_NONE: no boost (full-season trust, healthy starter)
//   in between: linearly tapered
// Window centered on the "borderline" range (40-50 GP) where neither current nor
// historical is fully right. Giannis at 36 GP still ramping up → full historical;
// healthy starters at 60+ GP → trust their actual current performance.
const BOOST_GP_FULL = 40;
const BOOST_GP_NONE = 50;
function boostFraction(currentGP) {
  if (currentGP >= BOOST_GP_NONE) return 0;
  if (currentGP <= BOOST_GP_FULL) return 1;
  return (BOOST_GP_NONE - currentGP) / (BOOST_GP_NONE - BOOST_GP_FULL);
}

// Fit dampening: how much the learned lineup-composition coefficients are applied.
// 1.0 = full strength (raw learned coefficients), 0.0 = ignore fit entirely (pure quality).
// 0.5 means individual player quality is weighted ~2× more than empirical lineup effects.
// Rationale: fit buckets average across all lineups with N high-USG players; they can't
// distinguish a usage-stacking-with-Giannis from usage-stacking-with-three-iso-scorers.
// Damping lets star talent override generic bucket penalties.
const FIT_WEIGHT = 0.35;

// Box-score composite weights (calibrated to roughly approximate DEF_SCORE scale)
const COMP_BLK = 5, COMP_STL = 5, COMP_DREB = 40;

// Lineup-context: usage redistribution. Each player's USG_PCT is their season-long
// average across all the 5-man combos they played in. When five specific players
// share a court, possessions are strictly zero-sum: Σ(USG) must equal 100%.
// Without normalization, stacking multiple stars (whose individual season USGs each
// reflect being the alpha on their team) gives a lineup with USG total >> 100%,
// which is mathematically impossible and over-counts high-USG buckets in the fit
// coefficient lookup. Normalization rescales each player's USG so the lineup sums
// to TOTAL_USG_TARGET, capturing how their roles would actually compress.
const TOTAL_USG_TARGET = 1.0;

// TS% diminishing returns: empirically, TS% shifts by ~−0.6 percentage points per
// +1 percentage point of USG. So when a player's USG is forced down (e.g., star on
// a stacked lineup), they get easier shots → TS% rises. Forced up (role player
// stretched into more creation) → TS% drops. We translate the lineup-wide net TS
// shift into a small NetRtg adjustment.
//   USG_TS_SLOPE      — TS percentage points per 1pp USG shift (basketball-research value)
//   TS_EFFICIENCY_FACTOR — converts TS percentage point gain to NetRtg contribution
//                          (small to avoid double-counting effects already in fit coefs)
const USG_TS_SLOPE = -0.6;
const TS_EFFICIENCY_FACTOR = 0.03;

function normalizeLineupUsages(players) {
  const total = players.reduce((s, p) => s + (p.usg || 0), 0);
  if (total <= 0.01) {
    // edge case: all-zero (shouldn't happen in real data); split evenly
    return players.map(p => ({
      ...p, usg_raw: p.usg, usg: 0.2,
      ts_raw: p.ts, ts: p.ts, ts_delta_pp: 0,
    }));
  }
  const scale = TOTAL_USG_TARGET / total;
  return players.map(p => {
    const usg_norm = (p.usg || 0) * scale;
    // TS diminishing returns: ts shifts by -SLOPE per +1pp USG shift
    // (forced-down USG ⇒ TS rises; forced-up ⇒ TS drops)
    const usg_delta_pp = (usg_norm - (p.usg || 0)) * 100;
    const ts_delta_pp = -USG_TS_SLOPE * usg_delta_pp;
    const ts_norm = Math.max(0.30, Math.min(0.78, (p.ts || 0.55) + ts_delta_pp / 100));
    return {
      ...p,
      usg_raw: p.usg,
      usg: usg_norm,
      ts_raw: p.ts,
      ts: ts_norm,
      ts_delta_pp,   // signed: positive when TS gained (USG forced down)
    };
  });
}

// Sum of per-player NetRtg contributions from TS diminishing returns.
// Positive when stars are forced down in USG (lineup gets more efficient overall);
// negative when a low-usage lineup is being asked to take more shots than usual.
function tsEfficiencyBonus(normalized) {
  return normalized.reduce((s, p) => s + (p.ts_delta_pp || 0) * TS_EFFICIENCY_FACTOR, 0);
}

let playerDb = null, lineupsDb = null, coefs = null;
let NAME_DICT = {};
let QUALITY = null;
let DEFENSE = {};      // HH name → { def_score, team, gp }

const STATE = {
  page: 'team', season: null, season_type: 'Regular Season', team: null,
  originalLineup: null,
  currentSlots: [null, null, null, null, null],
  swappedFrom: [null, null, null, null, null],
};

const $ = id => document.getElementById(id);
const setStatus = (msg, cls = '') => {
  const el = $('status');
  if (cls === 'hidden') { el.className = 'hidden'; return; }
  el.textContent = msg;
  el.className = cls;
};

async function boot() {
  try {
    setStatus('Loading SQL engine...');
    const SQL = await initSqlJs({ locateFile: f => `https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.10.3/${f}` });

    setStatus('Downloading data...');
    const [playerBuf, lineupsBuf, coefsJson, namesJson, qualityJson, defenseData] = await Promise.all([
      fetchDb(PLAYER_DB_URL),
      fetchDb(LINEUPS_DB_URL),
      fetch(COEFS_URL).then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); }),
      fetch(NAMES_URL).then(r => r.ok ? r.json() : {}).catch(() => ({})),
      fetch(QUALITY_URL).then(r => r.ok ? r.json() : null).catch(() => null),
      loadDefenseData().catch(e => { console.warn('Defense data failed:', e); return {}; }),
    ]);

    playerDb  = new SQL.Database(new Uint8Array(playerBuf));
    lineupsDb = new SQL.Database(new Uint8Array(lineupsBuf));
    coefs = coefsJson;
    NAME_DICT = namesJson || {};
    QUALITY = qualityJson;
    DEFENSE = defenseData || {};

    const commonSeasons = getCommonSeasons();
    STATE.season = commonSeasons[0];

    const totalMB = ((playerBuf.byteLength + lineupsBuf.byteLength) / 1024 / 1024).toFixed(1);
    const qNote = QUALITY ? `${QUALITY._meta.n_players} quality scores` : 'NO QUALITY DATA — fix';
    const dNote = Object.keys(DEFENSE).length > 0 ? `${Object.keys(DEFENSE).length} defense scores` : 'no defense data';
    $('meta').textContent = `${totalMB}MB · ${commonSeasons.length} seasons · ${qNote} · ${dNote} · ${coefs.meta.n_lineups.toLocaleString()} lineups trained`;

    setStatus('', 'hidden');
    if (!QUALITY) {
      setStatus('⚠ player_quality.json failed to load — projections falling back to watermark-only. Check that the file is deployed at the URL.', 'error');
    } else if (Object.keys(NAME_DICT).length === 0) {
      setStatus('⚠ name_dictionary.json failed to load — quality lookups may miss players with accent marks (Jokić, Dončić, etc.)', 'error');
    }
    renderTeamPicker();
    wireModal();

    // Logo click → reset to team picker (preserves season/season_type selections)
    const logoEl = document.querySelector('.header .logo');
    if (logoEl) {
      logoEl.addEventListener('click', () => {
        STATE.page = 'team';
        STATE.team = null;
        STATE.originalSlots = null;
        STATE.currentSlots = null;
        STATE.swappedFrom = [null, null, null, null, null];
        STATE.originalLineupRow = null;
        renderTeamPicker();
      });
    }
  } catch (err) {
    console.error(err);
    setStatus('Failed to load: ' + err.message, 'error');
  }
}

async function fetchDb(url) {
  const r = await fetch(url);
  if (!r.ok) throw new Error(`HTTP ${r.status} fetching ${url}`);
  if (url.endsWith('.gz')) {
    const ds = new DecompressionStream('gzip');
    return await new Response(r.body.pipeThrough(ds)).arrayBuffer();
  }
  return await r.arrayBuffer();
}

// Fetch and parse the Defensive_Rankings sheet. Returns { HH_name: { def_score, team, gp } }.
// The sheet has multiple sections (Season, Last 30D, Last 7D, Last Day) — we want the
// Season section, which appears first. Sections are delimited by [LAST_30D] / [LAST_7D] /
// [LAST_DAY] markers in column 0.
async function loadDefenseData() {
  const res = await fetch(DEF_URL);
  if (!res.ok) throw new Error(`HTTP ${res.status} fetching defense sheet`);
  const data = await res.json();
  const rows = data.values || [];
  if (!rows.length) return {};

  // Find the header row (first row with "PLAYER" in column 0)
  let headerIdx = -1;
  for (let i = 0; i < Math.min(rows.length, 20); i++) {
    if (((rows[i][0] || '').trim()) === 'PLAYER') { headerIdx = i; break; }
  }
  if (headerIdx === -1) return {};

  const headers = rows[headerIdx];
  const idx = {};
  headers.forEach((h, i) => { idx[(h || '').trim()] = i; });
  if (idx.PLAYER === undefined || idx.DEF_SCORE === undefined) return {};

  const STOP_MARKERS = ['[LAST_DAY]', '[LAST_7D]', '[LAST_30D]'];
  const result = {};
  for (let i = headerIdx + 1; i < rows.length; i++) {
    const row = rows[i];
    const first = (row[0] || '').trim();
    if (STOP_MARKERS.includes(first)) break;  // hit next section
    const name = (row[idx.PLAYER] || '').trim();
    if (!name) continue;
    const score = parseFloat(row[idx.DEF_SCORE]);
    if (isNaN(score)) continue;
    result[name] = {
      def_score: score,
      team: (row[idx.TEAM] || '').trim(),
      gp: parseInt(row[idx.GP]) || 0,
    };
  }
  return result;
}

function getCommonSeasons() {
  const p = playerDb.exec("SELECT DISTINCT SEASON FROM player_advanced ORDER BY SEASON DESC")[0].values.map(r => r[0]);
  const l = lineupsDb.exec("SELECT DISTINCT SEASON FROM lineups_5man ORDER BY SEASON DESC")[0].values.map(r => r[0]);
  return p.filter(s => l.includes(s));
}

function getAvailableSeasonTypes(season) {
  const r = lineupsDb.exec(`
    SELECT DISTINCT SEASON_TYPE, COUNT(*) AS n
    FROM lineups_5man
    WHERE SEASON = '${season}'
    GROUP BY SEASON_TYPE
    ORDER BY n DESC
  `);
  if (!r.length || !r[0].values.length) return [];
  const types = r[0].values.map(([type, n]) => ({ type, n }));
  // If both Regular Season and Playoffs exist, expose a synthetic "Combined" option
  // that aggregates rows across both season_types (weighted by MIN for ratings).
  const hasRS = types.find(t => t.type === 'Regular Season');
  const hasPO = types.find(t => t.type === 'Playoffs');
  if (hasRS && hasPO) {
    types.unshift({ type: '__COMBINED__', n: hasRS.n + hasPO.n, label: 'Reg Season + Playoffs' });
  }
  return types;
}

// SQL fragment for filtering by STATE.season_type. Combined uses IN(); single uses =.
function seasonTypeWhere() {
  if (STATE.season_type === '__COMBINED__') return `SEASON_TYPE IN ('Regular Season', 'Playoffs')`;
  return `SEASON_TYPE = '${STATE.season_type}'`;
}
function seasonTypeLabel() {
  return STATE.season_type === '__COMBINED__' ? 'RS+PO' : STATE.season_type;
}

function renderBreadcrumb() {
  const commonSeasons = getCommonSeasons();
  const seasonOpts = commonSeasons.map(s => `<option value="${s}" ${s === STATE.season ? 'selected' : ''}>${s}</option>`).join('');
  const seasonSel = `<select id="seasonSelect">${seasonOpts}</select>`;

  // Season type selector — only show types that have data in this season
  const types = getAvailableSeasonTypes(STATE.season);
  if (!types.find(t => t.type === STATE.season_type) && types.length > 0) {
    // Prefer Combined when available, else first available
    const combinedOpt = types.find(t => t.type === '__COMBINED__');
    STATE.season_type = combinedOpt ? '__COMBINED__' : types[0].type;
  }
  let typeSel = '';
  if (types.length > 1) {
    const typeOpts = types.map(({type, n, label}) => `<option value="${type}" ${type === STATE.season_type ? 'selected' : ''}>${label || type} (${n.toLocaleString()})</option>`).join('');
    typeSel = `<select id="typeSelect" style="margin-left:0.35rem">${typeOpts}</select>`;
  } else if (types.length === 1) {
    typeSel = `<span style="margin-left:0.35rem;font-family:'JetBrains Mono',monospace;font-size:0.72rem;color:var(--muted)">${types[0].label || types[0].type}</span>`;
  }

  const crumbs = [];
  if (STATE.page === 'team') {
    crumbs.push(`<span class="crumb active">Choose team</span>`);
    crumbs.push(`<span class="sep">·</span>${seasonSel}${typeSel}`);
  } else if (STATE.page === 'lineup') {
    crumbs.push(`<span class="crumb" data-go="team">← Team</span>`);
    crumbs.push(`<span class="sep">›</span>`);
    crumbs.push(`<span class="crumb active">Choose ${STATE.team}'s lineup</span>`);
    crumbs.push(`<span class="sep">·</span>${seasonSel}${typeSel}`);
  } else if (STATE.page === 'edit') {
    crumbs.push(`<span class="crumb" data-go="team">← Team</span>`);
    crumbs.push(`<span class="sep">›</span>`);
    crumbs.push(`<span class="crumb" data-go="lineup">${STATE.team} lineups</span>`);
    crumbs.push(`<span class="sep">›</span>`);
    crumbs.push(`<span class="crumb active">Swap &amp; project</span>`);
  }
  $('breadcrumb').innerHTML = crumbs.join('');

  const seasonEl = $('seasonSelect');
  if (seasonEl) {
    seasonEl.addEventListener('change', (e) => {
      STATE.season = e.target.value;
      if (STATE.page === 'team') renderTeamPicker();
      else if (STATE.page === 'lineup') renderLineupPicker();
    });
  }
  const typeEl = $('typeSelect');
  if (typeEl) {
    typeEl.addEventListener('change', (e) => {
      STATE.season_type = e.target.value;
      if (STATE.page === 'team') renderTeamPicker();
      else if (STATE.page === 'lineup') renderLineupPicker();
    });
  }
  document.querySelectorAll('.breadcrumb .crumb[data-go]').forEach(el => {
    el.addEventListener('click', () => {
      STATE.page = el.dataset.go;
      if (STATE.page === 'team') renderTeamPicker();
      else if (STATE.page === 'lineup') renderLineupPicker();
    });
  });
}

function renderTeamPicker() {
  STATE.page = 'team';
  renderBreadcrumb();

  const teams = lineupsDb.exec(`
    SELECT TEAM_ABBREVIATION, COUNT(DISTINCT GROUP_ID) AS n_lineups
    FROM lineups_5man
    WHERE SEASON = '${STATE.season}'
      AND ${seasonTypeWhere()}
    GROUP BY TEAM_ABBREVIATION
    ORDER BY TEAM_ABBREVIATION
  `);
  if (!teams.length || !teams[0].values.length) {
    $('content').innerHTML = `<div class="empty-state">No ${seasonTypeLabel().toLowerCase()} lineup data for ${STATE.season}. Try another season or season type.</div>`;
    return;
  }

  const tiles = teams[0].values.map(([abbr, n]) => `
    <div class="team-tile" data-team="${abbr}">${abbr}<div class="team-full">${n} lineups</div></div>
  `).join('');
  $('content').innerHTML = `<div class="team-grid">${tiles}</div>`;
  document.querySelectorAll('.team-tile').forEach(t => {
    t.addEventListener('click', () => {
      STATE.team = t.dataset.team;
      renderLineupPicker();
    });
  });
}

async function renderLineupPicker() {
  STATE.page = 'lineup';
  renderBreadcrumb();
  $('content').innerHTML = `<div class="empty-state">Loading lineups…</div>`;

  // Yield so the loading state actually renders before we run 20 projections
  await new Promise(resolve => setTimeout(resolve, 0));

  // When Combined, aggregate GP/MIN as sums and ratings as MIN-weighted means
  // across both season_types. When single, simple filter and sort by MIN.
  const isCombined = STATE.season_type === '__COMBINED__';
  const r = lineupsDb.exec(isCombined ? `
    SELECT GROUP_ID,
           MAX(GROUP_NAME) AS GROUP_NAME,
           SUM(GP) AS GP,
           SUM(MIN) AS MIN,
           SUM(OFF_RATING * MIN) / NULLIF(SUM(MIN), 0) AS OFF_RATING,
           SUM(DEF_RATING * MIN) / NULLIF(SUM(MIN), 0) AS DEF_RATING,
           SUM(NET_RATING * MIN) / NULLIF(SUM(MIN), 0) AS NET_RATING,
           SUM(PACE * MIN)       / NULLIF(SUM(MIN), 0) AS PACE
    FROM lineups_5man
    WHERE TEAM_ABBREVIATION = '${STATE.team}' AND SEASON = '${STATE.season}'
      AND SEASON_TYPE IN ('Regular Season', 'Playoffs')
    GROUP BY GROUP_ID
    ORDER BY SUM(MIN) DESC
    LIMIT 20
  ` : `
    SELECT GROUP_ID, GROUP_NAME, GP, MIN, OFF_RATING, DEF_RATING, NET_RATING, PACE
    FROM lineups_5man
    WHERE TEAM_ABBREVIATION = '${STATE.team}' AND SEASON = '${STATE.season}'
      AND SEASON_TYPE = '${STATE.season_type}'
    ORDER BY MIN DESC
    LIMIT 20
  `);

  if (!r.length || !r[0].values.length) {
    $('content').innerHTML = `<div class="empty-state">No ${seasonTypeLabel().toLowerCase()} lineups for ${STATE.team} in ${STATE.season}.</div>`;
    return;
  }

  // For each lineup: load 5 players, project, capture full names.
  // Falls back to GROUP_NAME and actual NetRtg if any player can't be loaded
  // (e.g., low-minutes filter or missing quality data).
  const enriched = r[0].values.map(row => {
    const [gid, gname, gp, min, ortg, drtg, netrtg, pace] = row;
    const playerIds = String(gid).replace(/^-|-$/g, '').split('-').filter(Boolean).map(Number);
    let displayNames = null, projected = null;
    if (playerIds.length === 5) {
      const loaded = playerIds.map(pid => loadPlayer(pid, STATE.season));
      if (loaded.every(p => p)) {
        try {
          projected = projectLineup(loaded).netrtg;
          displayNames = loaded.map(p => p.name);
        } catch (e) {
          console.warn('Projection failed for', gid, e);
        }
      }
    }
    if (!displayNames) {
      displayNames = String(gname).split(' - ').map(n => n.trim()).filter(Boolean);
    }
    return { gid, gp, min, netrtg, projected, displayNames };
  });

  const cards = enriched.map(row => {
    const namesHtml = row.displayNames.map((n, i) => i === 0 ? n : `<span class="sep">·</span>${n}`).join('');
    const isProjected = row.projected !== null;
    const displayNet = isProjected ? row.projected : row.netrtg;
    const netCls = displayNet >= 3 ? 'pos' : displayNet <= -3 ? 'neg' : 'neutral';
    const recordStr = isProjected ? (() => { const r = projectRecord(displayNet); return `${r.wins}-${r.losses}`; })() : '—';
    return `
      <div class="lineup-card" data-gid="${row.gid}">
        <div class="names">${namesHtml}</div>
        <div class="stat"><div class="lbl">GP</div><div class="val">${Math.round(row.gp)}</div></div>
        <div class="stat"><div class="lbl">MIN</div><div class="val">${Math.round(row.min)}</div></div>
        <div class="stat net"><div class="lbl">${isProjected ? 'Proj NetRtg' : 'NetRtg'}</div><div class="val ${netCls}">${displayNet >= 0 ? '+' : ''}${Number(displayNet).toFixed(1)}</div></div>
        <div class="stat"><div class="lbl">82g</div><div class="val" style="font-size:0.85rem">${recordStr}</div></div>
        <div class="stat"><div class="lbl">→</div><div class="val">▸</div></div>
      </div>
    `;
  }).join('');

  $('content').innerHTML = `
    <div style="margin-bottom:0.85rem;font-size:0.78rem;color:var(--text2)">
      ${STATE.team} 5-man lineups — ${STATE.season} ${seasonTypeLabel()} — sorted by minutes played, NetRtg from projection model. Click any to start swapping.
    </div>
    <div class="lineup-list">${cards}</div>
  `;
  document.querySelectorAll('.lineup-card').forEach(card => {
    card.addEventListener('click', () => loadOriginalLineup(card.dataset.gid));
  });
}

function loadOriginalLineup(groupId) {
  const isCombined = STATE.season_type === '__COMBINED__';
  const r = lineupsDb.exec(isCombined ? `
    SELECT GROUP_ID,
           MAX(GROUP_NAME) AS GROUP_NAME,
           SUM(GP) AS GP,
           SUM(MIN) AS MIN,
           SUM(OFF_RATING * MIN) / NULLIF(SUM(MIN), 0) AS OFF_RATING,
           SUM(DEF_RATING * MIN) / NULLIF(SUM(MIN), 0) AS DEF_RATING,
           SUM(NET_RATING * MIN) / NULLIF(SUM(MIN), 0) AS NET_RATING,
           SUM(PACE * MIN)       / NULLIF(SUM(MIN), 0) AS PACE
    FROM lineups_5man
    WHERE TEAM_ABBREVIATION = '${STATE.team}' AND SEASON = '${STATE.season}'
      AND SEASON_TYPE IN ('Regular Season', 'Playoffs')
      AND GROUP_ID = '${groupId.replace(/'/g, "''")}'
    GROUP BY GROUP_ID
    LIMIT 1
  ` : `
    SELECT GROUP_ID, GROUP_NAME, GP, MIN, OFF_RATING, DEF_RATING, NET_RATING, PACE
    FROM lineups_5man
    WHERE TEAM_ABBREVIATION = '${STATE.team}' AND SEASON = '${STATE.season}'
      AND SEASON_TYPE = '${STATE.season_type}'
      AND GROUP_ID = '${groupId.replace(/'/g, "''")}'
    LIMIT 1
  `);
  if (!r.length) return alert('Lineup row not found.');
  const [gid, gname, gp, min, ortg, drtg, netrtg, pace] = r[0].values[0];

  const playerIds = String(gid).replace(/^-|-$/g, '').split('-').filter(Boolean).map(Number);
  if (playerIds.length !== 5) return alert(`Could not parse 5 player IDs (got ${playerIds.length}).`);

  const players = playerIds.map(pid => loadPlayer(pid, STATE.season));
  if (players.some(p => !p)) {
    alert('Could not load full stats for all 5 players (low minutes or filter excluded). Try another lineup.');
    return;
  }

  STATE.originalLineup = { players, gid, gname, stats: { ortg:+ortg, drtg:+drtg, netrtg:+netrtg, pace:+pace, gp:+gp, min:+min } };
  STATE.currentSlots = [...players];
  STATE.swappedFrom = [null, null, null, null, null];
  renderEditView();
}

function loadPlayer(playerId, preferredSeason) {
  // Try preferred season first; if no qualifying data (low minutes or
  // injured), fall back to the player's most recent season with rotation
  // minutes. This handles cases like Haliburton (out 2025-26 with Achilles)
  // where we want to use his last healthy year.
  const r = playerDb.exec(`
    SELECT a.PLAYER_ID, a.PLAYER_NAME, a.TEAM_ABBREVIATION, a.SEASON,
           a.OFF_RATING, a.DEF_RATING, a.NET_RATING, a.USG_PCT, a.TS_PCT,
           a.AST_PCT, a.REB_PCT, a.PIE, a.PACE, a.MIN, a.GP,
           b.FG3_PCT, b.FG3A, b.BLK
    FROM player_advanced a
    LEFT JOIN player_base b ON a.PLAYER_ID = b.PLAYER_ID AND a.SEASON = b.SEASON AND a.SEASON_TYPE = b.SEASON_TYPE
    WHERE a.PLAYER_ID = ${playerId}
      AND a.SEASON_TYPE = 'Regular Season'
      AND CAST(a.MIN AS FLOAT) >= 10
      AND CAST(a.GP AS INTEGER) >= 5
    ORDER BY
      CASE WHEN a.SEASON = '${preferredSeason}' THEN 0 ELSE 1 END,
      a.SEASON DESC
    LIMIT 1
  `);
  if (!r.length || !r[0].values.length) return null;
  const v = r[0].values[0];
  return {
    player_id: v[0], name: v[1], team: v[2], season: v[3],
    ortg:+v[4], drtg:+v[5], netrtg:+v[6], usg:+v[7], ts:+v[8],
    ast_pct:+v[9], reb_pct:+v[10], pie:+v[11], pace:+v[12], min:+v[13], gp:+v[14],
    fg3p:+v[15], fg3a:+v[16], blk:+v[17],
  };
}

function renderEditView() {
  STATE.page = 'edit';
  renderBreadcrumb();

  const orig = STATE.originalLineup;
  const projOrig = projectLineup(orig.players);
  const projCurr = projectLineup(STATE.currentSlots);
  const headlineCls = projCurr.netrtg >= 7 ? 'green' : projCurr.netrtg <= -3 ? 'red' : 'orange';
  const delta = projCurr.netrtg - projOrig.netrtg;
  const deltaCls = delta > 0.5 ? 'pos' : delta < -0.5 ? 'neg' : 'zero';

  const slotsHtml = STATE.currentSlots.map((p, i) => {
    const swapped = STATE.swappedFrom[i] !== null;
    const fromName = swapped ? STATE.swappedFrom[i].name.split(' ').slice(-1)[0] : null;
    const q = projCurr.quality_per_player[i];
    const np = projCurr.normalized_players[i];  // has .usg (lineup-normalized) and .usg_raw (season)

    // Offense line: rat365 + offense contribution
    let offLine;
    if (q.fallback) {
      offLine = `<span style="color:var(--orange)">rat365 N/A</span>`;
    } else if (q.off_blended) {
      const curText = q.rat365_current !== null ? `cur ${q.rat365_current.toFixed(1)}` : `no current`;
      const tip = q.rat365_current !== null
        ? `Current ${q.rat365_current.toFixed(1)} below career; using ${q.off_n_seasons}-season weighted ${q.rat365.toFixed(1)}`
        : `Using ${q.off_n_seasons}-season weighted history`;
      offLine = `<span style="color:var(--purple)" title="${tip}">↺ rat365 ${q.rat365.toFixed(1)} <span style="color:${q.off_contrib >= 0 ? 'var(--green)' : 'var(--red)'}">(off ${q.off_contrib >= 0 ? '+' : ''}${q.off_contrib.toFixed(1)})</span></span> <span style="color:var(--muted);font-size:0.6rem">(${curText})</span>`;
    } else {
      offLine = `rat365 ${q.rat365.toFixed(1)} <span style="color:${q.off_contrib >= 0 ? 'var(--green)' : 'var(--red)'}">(off ${q.off_contrib >= 0 ? '+' : ''}${q.off_contrib.toFixed(1)})</span>`;
    }

    // Defense line: DEF_SCORE + defense contribution
    let defLine;
    if (q.def_score === null) {
      defLine = `<span style="color:var(--muted)">DEF N/A</span>`;
    } else if (q.def_blended) {
      const curText = q.def_current !== null ? `cur ${q.def_current.toFixed(1)}` : `no current`;
      defLine = `<span style="color:var(--purple)" title="Defensive history blended">↺ DEF ${q.def_score.toFixed(1)} <span style="color:${q.def_contrib >= 0 ? 'var(--green)' : 'var(--red)'}">(def ${q.def_contrib >= 0 ? '+' : ''}${q.def_contrib.toFixed(1)})</span></span> <span style="color:var(--muted);font-size:0.6rem">(${curText})</span>`;
    } else {
      defLine = `DEF ${q.def_score.toFixed(1)} <span style="color:${q.def_contrib >= 0 ? 'var(--green)' : 'var(--red)'}">(def ${q.def_contrib >= 0 ? '+' : ''}${q.def_contrib.toFixed(1)})</span>`;
    }

    return `
      <div class="slot ${swapped ? 'swapped' : ''}">
        ${swapped ? `<div class="from-tag">was ${fromName}</div>` : ''}
        <div class="slot-num">Slot ${i + 1}</div>
        <div class="name">${p.name}</div>
        <div class="meta">${p.team || '—'} · ${p.season}</div>
        <div class="stats">
          ${offLine}<br>
          ${defLine}<br>
          USG ${(np.usg * 100).toFixed(1)}%${Math.abs(np.usg - np.usg_raw) > 0.005 ? ` <span style="color:var(--muted);font-size:0.6rem">(season ${(np.usg_raw * 100).toFixed(1)}%)</span>` : ''} · TS ${(np.ts * 100).toFixed(1)}%${Math.abs(np.ts - np.ts_raw) > 0.005 ? ` <span style="color:var(--muted);font-size:0.6rem">(season ${(np.ts_raw * 100).toFixed(1)}%)</span>` : ''}
        </div>
        <button class="swap-btn" data-slot="${i}">↔ Swap</button>
      </div>
    `;
  }).join('');

  const playersTable = STATE.currentSlots.map((p, i) => {
    const q = projCurr.quality_per_player[i];
    const swapped = STATE.swappedFrom[i] !== null;
    const origQ = projOrig?.quality_per_player?.[i];
    const swapDelta = (swapped && origQ) ? ((q.off_contrib + q.def_contrib) - (origQ.off_contrib + origQ.def_contrib)) : null;
    let rat365Cell, defCell, offContribCell, defContribCell;
    if (q.fallback) {
      rat365Cell = `<span style="color:var(--orange)">N/A</span>`;
      defCell = q.def_score !== null ? q.def_score.toFixed(1) : `<span style="color:var(--muted)">—</span>`;
      offContribCell = `<span style="color:var(--orange)">${q.off_contrib >= 0 ? '+' : ''}${q.off_contrib.toFixed(2)}*</span>`;
      defContribCell = `<span style="color:var(--muted)">${q.def_contrib >= 0 ? '+' : ''}${q.def_contrib.toFixed(2)}</span>`;
    } else {
      rat365Cell = q.off_blended
        ? `<span style="color:var(--purple);font-weight:700" title="↺ blended">${q.rat365.toFixed(1)}</span>`
        : q.rat365.toFixed(1);
      defCell = q.def_score === null
        ? `<span style="color:var(--muted)">—</span>`
        : (q.def_blended
            ? `<span style="color:var(--purple);font-weight:700" title="↺ blended">${q.def_score.toFixed(1)}</span>`
            : q.def_score.toFixed(1));
      offContribCell = `<span class="${q.off_contrib > 0.1 ? 'adj-pos' : q.off_contrib < -0.1 ? 'adj-neg' : ''}">${q.off_contrib >= 0 ? '+' : ''}${q.off_contrib.toFixed(2)}</span>`;
      defContribCell = `<span class="${q.def_contrib > 0.1 ? 'adj-pos' : q.def_contrib < -0.1 ? 'adj-neg' : ''}">${q.def_contrib >= 0 ? '+' : ''}${q.def_contrib.toFixed(2)}</span>`;
    }
    const fromName = swapped ? STATE.swappedFrom[i].name.split(' ').slice(-1)[0] : null;
    const playerLabel = swapped
      ? `${i + 1}. <span style="color:var(--accent);font-weight:700">↻</span> ${p.name} <span style="color:var(--muted);font-size:0.7rem">(was ${fromName})</span>`
      : `${i + 1}. ${p.name}`;
    const vsPrevCell = swapDelta === null
      ? `<span style="color:var(--muted)">—</span>`
      : `<span class="${swapDelta > 0.1 ? 'adj-pos' : swapDelta < -0.1 ? 'adj-neg' : ''}" style="font-weight:700">${swapDelta >= 0 ? '+' : ''}${swapDelta.toFixed(2)}</span>`;
    const rowStyle = swapped ? ' style="background:rgba(99,102,241,0.07)"' : '';
    return `
      <tr${rowStyle}>
        <td>${playerLabel}</td>
        <td class="num">${rat365Cell}</td>
        <td class="num">${defCell}</td>
        <td class="num">${offContribCell}</td>
        <td class="num">${defContribCell}</td>
        <td class="num">${(q.off_contrib + q.def_contrib >= 0 ? '+' : '') + (q.off_contrib + q.def_contrib).toFixed(2)}</td>
        <td class="num">${vsPrevCell}</td>
      </tr>
    `;
  }).join('');

  $('content').innerHTML = `
    <div class="proj-panel">
      <div class="proj-row">
        <div class="proj-stat headline ${headlineCls}">
          <div class="label">Projected Net Rtg</div>
          <div class="value">${projCurr.netrtg >= 0 ? '+' : ''}${projCurr.netrtg.toFixed(1)}</div>
          <div class="delta ${deltaCls}">${delta >= 0 ? '+' : ''}${delta.toFixed(1)} vs original</div>
        </div>
        <div class="proj-stat">
          <div class="label">Proj ORtg</div>
          <div class="value">${projCurr.ortg.toFixed(1)}</div>
          <div class="delta ${cmpCls(projCurr.ortg - projOrig.ortg, true)}">${formatDelta(projCurr.ortg - projOrig.ortg)}</div>
        </div>
        <div class="proj-stat">
          <div class="label">Proj DRtg</div>
          <div class="value">${projCurr.drtg.toFixed(1)}</div>
          <div class="delta ${cmpCls(projCurr.drtg - projOrig.drtg, false)}">${formatDelta(projCurr.drtg - projOrig.drtg)}</div>
        </div>
        <div class="proj-stat">
          <div class="label">Pace</div>
          <div class="value">${projCurr.pace.toFixed(1)}</div>
        </div>
        <div class="proj-stat" title="Projected 82-game record if a team were built around this lineup. Lineup NetRtg is damped ~50% to convert short-burst performance to sustained team-level (2015-16 GSW had +10.8 team NetRtg / 73-9; their best lineup ran +20+). Ceiling ~75-7 — unprecedented territory.">          <div class="label">Proj 82-game record</div>
          <div class="value" style="font-size:1.3rem">${(() => { const r = projectRecord(projCurr.netrtg); return `${r.wins}-${r.losses}`; })()}</div>
          <div class="delta" style="color:var(--muted);font-size:0.65rem">team built around this 5</div>
        </div>
      </div>
      <div class="proj-tier">${classifyLineup(projCurr.netrtg)}${(() => { const r = projectRecord(projCurr.netrtg); const o = projectRecord(projOrig.netrtg); return ` · projected ${r.wins}-${r.losses} (vs original ${o.wins}-${o.losses}, ${r.wins-o.wins >= 0 ? '+' : ''}${r.wins-o.wins} wins)`; })()}</div>
      <div class="proj-tier" style="border-left-color:var(--gold)">
        <strong>Original lineup actual (${STATE.season} ${seasonTypeLabel()}):</strong>
        ORtg ${orig.stats.ortg.toFixed(1)} · DRtg ${orig.stats.drtg.toFixed(1)} ·
        NetRtg ${orig.stats.netrtg >= 0 ? '+' : ''}${orig.stats.netrtg.toFixed(1)} ·
        ${Math.round(orig.stats.min)} MIN in ${Math.round(orig.stats.gp)} games
        (model projected this lineup at NetRtg ${projOrig.netrtg >= 0 ? '+' : ''}${projOrig.netrtg.toFixed(1)})
      </div>
    </div>

    <div class="lineup-grid">${slotsHtml}</div>

    <div class="action-row">
      <button class="btn secondary" id="resetBtn">↻ Reset to Original</button>
    </div>

    <div class="breakdown">
      <h3>Player ingredients (two-axis quality)</h3>
      <table>
        <thead><tr><th>Player</th><th class="num">rat365</th><th class="num">DEF</th><th class="num">Off Δ</th><th class="num">Def Δ</th><th class="num">Net Δ</th><th class="num" title="Swap impact: this player's Net Δ minus the original player's Net Δ at this slot">vs prev</th></tr></thead>
        <tbody>
          ${playersTable}
          <tr class="total"><td>Lineup totals ${projCurr.n_off_blended > 0 || projCurr.n_def_blended > 0 ? `<span style="color:var(--purple);font-weight:normal">(↺ ${projCurr.n_off_blended} off / ${projCurr.n_def_blended} def blended)</span>` : ''} ${5 - projCurr.n_with_quality > 0 ? `<span style="color:var(--orange);font-weight:normal">(${5 - projCurr.n_with_quality} fallback*)</span>` : ''}</td>
            <td class="num">—</td><td class="num">—</td>
            <td class="num ${projCurr.total_off > 0 ? 'adj-pos' : projCurr.total_off < 0 ? 'adj-neg' : ''}">${projCurr.total_off >= 0 ? '+' : ''}${projCurr.total_off.toFixed(1)}</td>
            <td class="num ${projCurr.total_def > 0 ? 'adj-pos' : projCurr.total_def < 0 ? 'adj-neg' : ''}">${projCurr.total_def >= 0 ? '+' : ''}${projCurr.total_def.toFixed(1)}</td>
            <td class="num ${projCurr.quality_net_baseline > 0 ? 'adj-pos' : projCurr.quality_net_baseline < 0 ? 'adj-neg' : ''}">${projCurr.quality_net_baseline >= 0 ? '+' : ''}${projCurr.quality_net_baseline.toFixed(1)}</td>
            <td class="num ${(projCurr.quality_net_baseline - projOrig.quality_net_baseline) > 0.1 ? 'adj-pos' : (projCurr.quality_net_baseline - projOrig.quality_net_baseline) < -0.1 ? 'adj-neg' : ''}" style="font-weight:700">${(projCurr.quality_net_baseline - projOrig.quality_net_baseline) >= 0 ? '+' : ''}${(projCurr.quality_net_baseline - projOrig.quality_net_baseline).toFixed(2)}</td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="breakdown" style="margin-top:1rem;font-size:0.72rem;color:var(--muted);text-align:center">
      Two-axis quality (rat365 + DEF_SCORE) + learned fit coefficients + USG/TS lineup normalization. Fit adjustments and TS efficiency redistribution flow into the projected ORtg and DRtg above.
    </div>
  `;

  document.querySelectorAll('.swap-btn').forEach(btn => {
    btn.addEventListener('click', () => openSwapModal(parseInt(btn.dataset.slot, 10)));
  });
  $('resetBtn').addEventListener('click', () => {
    STATE.currentSlots = [...STATE.originalLineup.players];
    STATE.swappedFrom = [null, null, null, null, null];
    renderEditView();
  });
}

function formatDelta(d) { return Math.abs(d) < 0.05 ? '±0.0' : (d >= 0 ? '+' : '') + d.toFixed(1); }
function cmpCls(d, higherIsBetter) {
  if (Math.abs(d) < 0.5) return 'zero';
  const isPositive = higherIsBetter ? d > 0 : d < 0;
  return isPositive ? 'pos' : 'neg';
}

let swapTargetSlot = -1;
function openSwapModal(slotIdx) {
  swapTargetSlot = slotIdx;
  const current = STATE.currentSlots[slotIdx];
  $('swapTitle').textContent = `Swap ${current.name}`;
  $('swapSub').textContent = `Slot ${slotIdx + 1} — type any player name to find a replacement (loaded at their ${STATE.season} performance).`;
  $('swapInput').value = '';
  $('swapResults').innerHTML = '';
  $('swapModal').classList.add('open');
  setTimeout(() => $('swapInput').focus(), 50);
}
function closeSwapModal() { $('swapModal').classList.remove('open'); swapTargetSlot = -1; }
function wireModal() {
  $('swapClose').addEventListener('click', closeSwapModal);
  $('swapModal').addEventListener('click', (e) => { if (e.target.id === 'swapModal') closeSwapModal(); });
  $('swapInput').addEventListener('input', (e) => renderSwapResults(e.target.value.trim()));
}
function renderSwapResults(query) {
  if (!query || query.length < 2) { $('swapResults').innerHTML = ''; return; }
  // Search across ALL seasons — preference current, fall back to most recent
  // healthy season per player. This is what lets you swap in a player who
  // didn't play in the selected season (e.g., injured stars).
  const r = playerDb.exec(`
    SELECT PLAYER_ID, PLAYER_NAME, TEAM_ABBREVIATION, SEASON, GP, MIN, OFF_RATING, USG_PCT
    FROM player_advanced
    WHERE PLAYER_NAME LIKE '%${query.replace(/'/g, "''")}%'
      AND SEASON_TYPE = 'Regular Season'
      AND CAST(MIN AS FLOAT) >= 10
      AND CAST(GP AS INTEGER) >= 5
    ORDER BY PLAYER_NAME,
      CASE WHEN SEASON = '${STATE.season}' THEN 0 ELSE 1 END,
      SEASON DESC
  `);
  if (!r.length || !r[0].values.length) {
    $('swapResults').innerHTML = `<div class="empty-state" style="padding:1rem">No matches found</div>`;
    return;
  }
  // Group by player — first row wins (we already sorted preferred season first)
  const byPlayer = {};
  for (const v of r[0].values) {
    const pid = v[0];
    if (!(pid in byPlayer)) byPlayer[pid] = v;
  }
  const top = Object.values(byPlayer).slice(0, 8);
  const items = top.map(([pid, name, team, season, gp, min, ortg, usg]) => {
    const seasonTag = season === STATE.season ? '' :
      `<span style="color:var(--orange);margin-left:0.3rem">↶ ${season}</span>`;
    return `
      <div class="swap-result-item" data-pid="${pid}">
        <div class="name">${name}${seasonTag}</div>
        <div class="meta">${team || '—'} · ORtg ${Number(ortg).toFixed(0)} · USG ${(Number(usg) * 100).toFixed(1)}% · ${Number(gp).toFixed(0)}G ${Number(min).toFixed(0)} MIN</div>
      </div>
    `;
  }).join('');
  $('swapResults').innerHTML = items;
  document.querySelectorAll('.swap-result-item').forEach(el => {
    el.addEventListener('click', () => {
      const pid = parseInt(el.dataset.pid, 10);
      const newPlayer = loadPlayer(pid, STATE.season);
      if (!newPlayer) return alert('Could not load player.');
      if (STATE.swappedFrom[swapTargetSlot] === null) {
        STATE.swappedFrom[swapTargetSlot] = STATE.currentSlots[swapTargetSlot];
      }
      if (newPlayer.player_id === STATE.originalLineup.players[swapTargetSlot].player_id) {
        STATE.swappedFrom[swapTargetSlot] = null;
      }
      STATE.currentSlots[swapTargetSlot] = newPlayer;
      closeSwapModal();
      renderEditView();
    });
  });
}

// Cache the weighted rat365 computation per (player_id, current_season).
const _weightedRatCache = {};

// Constants for the weighted historical model.
const RECENCY_DECAY     = 0.65;  // each older season weight × this factor
const MIN_SEASON_GP     = 5;     // skip seasons below this GP (too noisy)
// PIE → rat365 conversion: rat365 ≈ (PIE_percent − SHIFT) × SCALE
// Calibrated against two anchor points: league-avg PIE 10% → rat365 4.7,
// elite PIE 21% → rat365 ~27. Players below PIE 7.68% map to rat365 0.
const PIE_SHIFT = 7.68;
const PIE_SCALE = 2.03;
const PIE_DERIVED_CAP = 35;  // hard ceiling so a fluky high-PIE season doesn't dominate

function seasonStartYear(s) { return parseInt(String(s).slice(0, 4), 10); }

function pieToRat365(pieDecimal) {
  const piePct = pieDecimal * 100;
  return Math.min(PIE_DERIVED_CAP, Math.max(0, (piePct - PIE_SHIFT) * PIE_SCALE));
}

// Compute a player's effective rat365 by weighting all available seasons.
// Returns: { effective, blended, current_rat365, seasons, n_seasons }
//   effective = max(current_rat365, blended) — asymmetric, only boost
//   blended   = weighted historical average (informational)
function computeWeightedRat365(playerId, nbaName, currentSeason) {
  if (!playerId || !playerDb) return null;
  const cacheKey = `${playerId}_${currentSeason}`;
  if (_weightedRatCache[cacheKey] !== undefined) return _weightedRatCache[cacheKey];

  const r = playerDb.exec(`
    SELECT SEASON, CAST(GP AS INTEGER) AS GP, CAST(MIN AS FLOAT) AS MIN, CAST(PIE AS REAL) AS PIE
    FROM player_advanced
    WHERE PLAYER_ID = ${playerId}
      AND SEASON_TYPE = 'Regular Season'
      AND CAST(GP AS INTEGER) >= ${MIN_SEASON_GP}
    ORDER BY SEASON DESC
  `);
  if (!r.length || !r[0].values.length) {
    _weightedRatCache[cacheKey] = null;
    return null;
  }

  let current_rat365 = null;
  if (QUALITY) {
    const hh = NAME_DICT[nbaName] || nbaName;
    if (QUALITY.players[hh]) current_rat365 = QUALITY.players[hh].rat365;
  }

  const currentYear = seasonStartYear(currentSeason);
  let totalWeighted = 0;
  let totalWeight = 0;
  const seasons = [];

  for (const [season, gp, min, pie] of r[0].values) {
    const yearDelta = currentYear - seasonStartYear(season);
    if (yearDelta < 0) continue;
    const recencyWeight = Math.pow(RECENCY_DECAY, yearDelta);
    const weight = gp * recencyWeight;

    let seasonRat, source;
    if (season === currentSeason && current_rat365 !== null) {
      seasonRat = current_rat365;
      source = 'rv';
    } else {
      seasonRat = pieToRat365(pie);
      source = 'pie';
    }
    totalWeighted += seasonRat * weight;
    totalWeight += weight;
    seasons.push({ season, gp, rat: seasonRat, weight, source });
  }

  if (totalWeight === 0) {
    _weightedRatCache[cacheKey] = null;
    return null;
  }
  const blended = totalWeighted / totalWeight;

  // Find current-season GP for the boost gate
  const currentSeasonEntry = seasons.find(s => s.season === currentSeason);
  const currentGP = currentSeasonEntry ? currentSeasonEntry.gp : 0;

  // Asymmetric rule with gradual GP-based taper: boost is fractional based on currentGP.
  //   - No current rat365 at all: use blend entirely.
  //   - Current data + below BOOST_GP_FULL: full boost (effective = blended).
  //   - Current data + above BOOST_GP_NONE: no boost (effective = current).
  //   - In between: effective = current + fraction × (blended − current), clamped non-negative.
  let effective;
  if (current_rat365 === null) {
    effective = blended;
  } else if (blended > current_rat365) {
    const f = boostFraction(currentGP);
    effective = current_rat365 + f * (blended - current_rat365);
  } else {
    effective = current_rat365;
  }
  const result = { effective, blended, current_rat365, currentGP, seasons, n_seasons: seasons.length };
  _weightedRatCache[cacheKey] = result;
  return result;
}

// Quality lookup with asymmetric weighted-historical model.
function getQuality(nbaName, playerId) {
  const w = computeWeightedRat365(playerId, nbaName, STATE.season);
  if (!w) return null;
  const hh = NAME_DICT[nbaName] || nbaName;
  // "Blended" = we actually used the historical boost (weighted > current).
  // For players with no current rat365 at all, the blend is what we use.
  const usingBlend = (w.current_rat365 === null) || (w.blended > w.current_rat365 + 1.0);
  return {
    hh_name: hh,
    rat365: w.effective,
    rat365_current: w.current_rat365,
    rat365_blended: w.blended,
    seasons: w.seasons,
    n_seasons: w.n_seasons,
    blended: usingBlend,
    source: w.current_rat365 !== null ? (usingBlend ? 'boosted' : 'current') : 'history-only',
  };
}

// ─── Defense quality: similar architecture, using DEF_SCORE + box-score composite ───

const _defScoreCache = {};

// Box-score derived defensive composite, calibrated to roughly approximate DEF_SCORE scale.
// Inputs: BLK/game, STL/game, DREB_PCT (decimal 0-0.30).
// Used as historical proxy when DEF_SCORE isn't available for older seasons.
function boxScoreDefComposite(blk, stl, dreb_pct) {
  return COMP_BLK * (blk || 0) + COMP_STL * (stl || 0) + COMP_DREB * (dreb_pct || 0);
}

function computeWeightedDefScore(playerId, nbaName, currentSeason) {
  if (!playerId || !playerDb) return null;
  const cacheKey = `${playerId}_${currentSeason}`;
  if (_defScoreCache[cacheKey] !== undefined) return _defScoreCache[cacheKey];

  const r = playerDb.exec(`
    SELECT a.SEASON, CAST(a.GP AS INTEGER) AS GP,
           CAST(a.DREB_PCT AS REAL) AS DREB_PCT,
           CAST(b.BLK AS REAL) AS BLK, CAST(b.STL AS REAL) AS STL
    FROM player_advanced a
    LEFT JOIN player_base b ON a.PLAYER_ID = b.PLAYER_ID AND a.SEASON = b.SEASON AND a.SEASON_TYPE = b.SEASON_TYPE
    WHERE a.PLAYER_ID = ${playerId}
      AND a.SEASON_TYPE = 'Regular Season'
      AND CAST(a.GP AS INTEGER) >= ${MIN_SEASON_GP}
    ORDER BY a.SEASON DESC
  `);
  if (!r.length || !r[0].values.length) {
    _defScoreCache[cacheKey] = null;
    return null;
  }

  // Get current DEF_SCORE from sheet if present
  let current_def_score = null;
  const hh = NAME_DICT[nbaName] || nbaName;
  if (DEFENSE[hh]) current_def_score = DEFENSE[hh].def_score;

  const currentYear = seasonStartYear(currentSeason);
  let totalWeighted = 0;
  let totalWeight = 0;
  const seasons = [];

  for (const [season, gp, dreb_pct, blk, stl] of r[0].values) {
    const yearDelta = currentYear - seasonStartYear(season);
    if (yearDelta < 0) continue;
    const recencyWeight = Math.pow(RECENCY_DECAY, yearDelta);
    const weight = gp * recencyWeight;
    const composite = boxScoreDefComposite(+blk, +stl, +dreb_pct);
    totalWeighted += composite * weight;
    totalWeight += weight;
    seasons.push({ season, gp, composite, weight });
  }

  if (totalWeight === 0) {
    _defScoreCache[cacheKey] = null;
    return null;
  }
  const blended = totalWeighted / totalWeight;

  // Find current-season GP for boost gate (same logic as rat365)
  const currentSeasonEntry = seasons.find(s => s.season === currentSeason);
  const currentGP = currentSeasonEntry ? currentSeasonEntry.gp : 0;

  let effective;
  if (current_def_score === null) {
    effective = blended;
  } else if (blended > current_def_score) {
    const f = boostFraction(currentGP);
    effective = current_def_score + f * (blended - current_def_score);
  } else {
    effective = current_def_score;
  }
  const result = { effective, blended, current_def_score, currentGP, seasons, n_seasons: seasons.length };
  _defScoreCache[cacheKey] = result;
  return result;
}

function getDefenseQuality(nbaName, playerId) {
  const d = computeWeightedDefScore(playerId, nbaName, STATE.season);
  if (!d) return null;
  const usingBlend = (d.current_def_score === null) || (d.blended > d.current_def_score + 1.5);
  return {
    def_score: d.effective,
    def_score_current: d.current_def_score,
    def_score_blended: d.blended,
    seasons: d.seasons,
    n_seasons: d.n_seasons,
    blended: usingBlend,
    source: d.current_def_score !== null ? (usingBlend ? 'boosted' : 'current') : 'history-only',
  };
}

function projectLineup(players) {
  // ── Layer 0: traditional additive (informational only) ──
  const add_ortg = mean(players.map(p => p.ortg));
  const add_drtg = mean(players.map(p => p.drtg));
  const pace = mean(players.map(p => p.pace));

  // ── Layer 1: two-axis quality ──
  // Offense per player:  (rat365 − 10) × 0.20
  // Defense per player:  (DEF_SCORE − 8) × 0.15
  // Each uses asymmetric weighted historical (peak boost for injured players).
  const quality_per_player = players.map(p => {
    const q = getQuality(p.name, p.player_id);
    const d = getDefenseQuality(p.name, p.player_id);

    // Offense contribution from rat365
    let rat365 = null, rat365_current = null, off_blended = false, off_n_seasons = 0;
    let off_contrib;
    if (q) {
      rat365 = q.rat365;
      rat365_current = q.rat365_current;
      off_blended = q.blended;
      off_n_seasons = q.n_seasons;
      off_contrib = (rat365 - OFF_CALIB) * OFF_SCALE;
    } else {
      off_contrib = (p.netrtg || 0) / 12;
    }

    // Defense contribution from DEF_SCORE
    let def_score = null, def_current = null, def_blended = false, def_n_seasons = 0;
    let def_contrib = 0;
    if (d) {
      def_score = d.def_score;
      def_current = d.def_score_current;
      def_blended = d.blended;
      def_n_seasons = d.n_seasons;
      def_contrib = (def_score - DEF_CALIB) * DEF_SCALE;
    }

    return {
      hh_name: q ? q.hh_name : (NAME_DICT[p.name] || p.name),
      rat365, rat365_current, off_blended, off_n_seasons,
      def_score, def_current, def_blended, def_n_seasons,
      off_contrib, def_contrib,
      net_contrib: off_contrib + def_contrib,
      fallback: !q,
    };
  });

  const total_off = quality_per_player.reduce((s, q) => s + q.off_contrib, 0);
  const total_def = quality_per_player.reduce((s, q) => s + q.def_contrib, 0);
  const quality_net_baseline = total_off + total_def;

  // ── Layer 2: fit coefficients (existing) ──
  // Normalize USG first — when stars share court, possessions redistribute (sum = 100%).
  // Without this, stacking multiple stars over-counts the high-USG bucket.
  // AST_PCT and REB_PCT aren't strictly zero-sum, so we leave them as raw season values.
  const normalized = normalizeLineupUsages(players);
  const n_high_usg    = normalized.filter(p => p.usg >= USG_HIGH).length;
  const n_shooters    = players.filter(p => p.fg3p >= SHOOT_OK && p.fg3a >= SHOOT_MIN_3PA).length;
  const n_rim_protect = players.filter(p => p.blk >= BLK_HIGH).length;
  const n_playmakers  = players.filter(p => p.ast_pct >= AST_HIGH).length;
  const n_rebounders  = players.filter(p => p.reb_pct >= REB_HIGH).length;
  const oBase = coefs.meta.baseline_ortg_resid_mean || 0;
  const dBase = coefs.meta.baseline_drtg_resid_mean || 0;
  const dims = [
    ['n_high_usg', n_high_usg, 'Usage stacking'],
    ['n_shooters', n_shooters, 'Spacing (shooters)'],
    ['n_rim_protect', n_rim_protect, 'Rim protection'],
    ['n_playmakers', n_playmakers, 'Playmaking depth'],
    ['n_rebounders', n_rebounders, 'Rebound depth'],
  ];
  let ortg_adj = 0, drtg_adj = 0;
  const breakdown = [];
  for (const [key, value, label] of dims) {
    const dim = coefs.dimensions[key];
    if (!dim) continue;
    const bucket = dim.buckets[String(value)];
    if (!bucket) { breakdown.push({ label, value, ortg_adj: 0, drtg_adj: 0, note: 'no data' }); continue; }
    const o = (bucket.ortg_adj - oBase) * FIT_WEIGHT;
    const d = (bucket.drtg_adj - dBase) * FIT_WEIGHT;
    ortg_adj += o; drtg_adj += d;
    breakdown.push({ label, value, ortg_adj: o, drtg_adj: d, n: bucket.n_samples });
  }
  const fit_net = ortg_adj - drtg_adj;

  // ── Combine: ORtg / DRtg / NetRtg ──
  // ORtg = LEAGUE_BASE + sum(offense contributions) + fit_ortg_adj
  // DRtg = LEAGUE_BASE − sum(defense contributions) + fit_drtg_adj
  //   (higher def_contrib → lower DRtg → better defense)
  // NetRtg = ORtg − DRtg = (total_off + total_def) + fit_net
  const display_ortg = LEAGUE_BASE + total_off + ortg_adj;
  const display_drtg = LEAGUE_BASE - total_def + drtg_adj;

  // TS diminishing-returns efficiency bonus from the USG normalization.
  // Star-stacked lineups: USGs forced down → TS up → small positive.
  // Low-usage lineups stretched: USGs forced up → TS down → small negative.
  const ts_bonus = tsEfficiencyBonus(normalized);

  return {
    add_ortg, add_drtg, pace,
    quality_per_player,
    normalized_players: normalized,
    total_off, total_def,
    quality_net_baseline,
    ts_bonus,
    n_with_quality: quality_per_player.filter(q => !q.fallback).length,
    n_off_blended: quality_per_player.filter(q => q.off_blended).length,
    n_def_blended: quality_per_player.filter(q => q.def_blended).length,
    ortg_adj, drtg_adj, fit_net,
    ortg: display_ortg + ts_bonus,           // efficiency lift flows to ORtg
    drtg: display_drtg,
    netrtg: quality_net_baseline + fit_net + ts_bonus,
    breakdown,
  };
}

function classifyLineup(netrtg) {
  if (netrtg >= 12) return '🏆 Championship-tier — elite both ways';
  if (netrtg >= 7)  return '⭐ Top-tier lineup — strong outlier expected';
  if (netrtg >= 3)  return '✓ Above-average lineup — solid net positive';
  if (netrtg >= -3) return '○ Average lineup — near league mean';
  if (netrtg >= -7) return '⚠ Below-average lineup — likely gets outscored';
  return '✗ Weak lineup — projects well below average';
}

// 82-game record estimate from a NetRtg projection.
// Lineup NetRtg systematically overstates team NetRtg because lineups are short
// bursts in favorable contexts. The 2015-16 Warriors (73-9, all-time wins record)
// had a *team* NetRtg of +10.8 — yet their best 5-man lineup ran +20+. To convert
// a hypothetical "what if this 5 played 82 games" projection into a realistic
// record, we damp the lineup NetRtg by ~50% to approximate sustained team-level
// performance, then apply the empirical NBA slope (~0.0353 win% per NetRtg point).
// Clamped at 0.92 so 75-7 is the achievable ceiling — anything beyond would
// require an unprecedented All-NBA 1st team lineup playing every minute.
function projectRecord(netrtg) {
  const teamNetRtg = netrtg * 0.5;
  const winPct = Math.max(0.08, Math.min(0.92, 0.5 + teamNetRtg * 0.0353));
  const wins = Math.round(winPct * 82);
  return { wins, losses: 82 - wins, winPct };
}

function mean(arr) {
  const valid = arr.filter(v => isFinite(v));
  return valid.reduce((s, v) => s + v, 0) / valid.length;
}

boot();
